      ]
      const COMMUNITY_COLORS = [
        '#4E79A7',
        '#F28E2B',
        '#E15759',
        '#76B7B2',
        '#59A14F',
        '#EDC948',
        '#B07AA1',
        '#FF9DA7',
        '#9C755F',
        '#BAB0AC',
      ]
      const nodes = new vis.DataSet(NODES_DATA)
      const edges = new vis.DataSet(EDGES_DATA)
      const network = new vis.Network(
        document.getElementById('graph'),
        { nodes, edges },
        {
          physics: {
            solver: 'forceAtlas2Based',
            forceAtlas2Based: { gravitationalConstant: -60, springLength: 120 },
            stabilization: { iterations: 200 },
          },
          interaction: { hover: true, tooltipDelay: 100 },
          nodes: { shape: 'dot', borderWidth: 1.5 },
          edges: { smooth: { type: 'continuous' }, arrows: { to: { enabled: true, scaleFactor: 0.4 } } },
        },
      )
      network.once('stabilizationIterationsDone', () => network.setOptions({ physics: { enabled: false } }))
      network.on('click', ({ nodes: sel }) => {
        if (!sel.length) return
        const n = NODES_DATA.find((x) => x.id === sel[0])
        if (!n) return
        document.getElementById('info').innerHTML =
          '<b>' +
          n.label +
          '</b><br>Category: ' +
          (n.category || '-') +
          '<br>Tags: ' +
          (n.tags || '-') +
          (n.summary ? '<br>' + n.summary : '')
      })
      const communities = {}
      NODES_DATA.forEach((n) => {
        if (n.community != null) communities[n.community] = (communities[n.community] || 0) + 1
      })
      const leg = document.getElementById('legend')
      Object.entries(communities)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cid, count]) => {
          const color = COMMUNITY_COLORS[cid % COMMUNITY_COLORS.length]
          leg.innerHTML +=
            '<div class="legend-item"><div class="dot" style="background:' +
            color +
            '"></div>Community ' +
            cid +
            ' (' +
            count +
            ')</div>'
        })
      document.getElementById('stats').textContent = NODES_DATA.length + ' pages - ' + EDGES_DATA.length + ' links'
    </script>
